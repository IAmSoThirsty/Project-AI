# Offline-first owner profile.
#
# Runtime projections are created by scripts/owner/Start-ProjectAI.ps1 from the
# account-bound encrypted store under .owner-state/credentials. On Windows the
# ephemeral projections use an SID-scoped common-data directory so Docker
# Desktop can read them across a fresh user profile; the owner and docker-users
# ACLs remain explicit. They are mounted read-only and removed by the owner stop
# path. No secret value is placed in .env or a container environment variable.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/project_ai_postgres_password
    secrets:
      - project_ai_postgres_password

  api:
    environment:
      PROJECT_AI_DATABASE_URL: !reset null
      PROJECT_AI_SETUP_SECRET: !reset null
      PROJECT_AI_MFA_KEY: !reset null
      PROJECT_AI_EXECUTION_SECRET: !reset null
      PROJECT_AI_DATABASE_URL_FILE: /run/secrets/project_ai_database_url
      PROJECT_AI_SETUP_SECRET_FILE: /run/secrets/project_ai_setup_secret
      PROJECT_AI_MFA_KEY_FILE: /run/secrets/project_ai_mfa_key
      PROJECT_AI_EXECUTION_SECRET_FILE: /run/secrets/project_ai_execution_secret
    secrets:
      - project_ai_database_url
      - project_ai_setup_secret
      - project_ai_mfa_key
      - project_ai_execution_secret

secrets:
  project_ai_postgres_password:
    file: ${PROJECT_AI_RUNTIME_SECRET_ROOT:-.owner-state/runtime}/postgres-password
  project_ai_database_url:
    file: ${PROJECT_AI_RUNTIME_SECRET_ROOT:-.owner-state/runtime}/database-url
  project_ai_setup_secret:
    file: ${PROJECT_AI_RUNTIME_SECRET_ROOT:-.owner-state/runtime}/setup-secret
  project_ai_mfa_key:
    file: ${PROJECT_AI_RUNTIME_SECRET_ROOT:-.owner-state/runtime}/mfa-key
  project_ai_execution_secret:
    file: ${PROJECT_AI_RUNTIME_SECRET_ROOT:-.owner-state/runtime}/execution-secret
