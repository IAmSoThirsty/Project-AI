name: Emergency SHA Pin Repair

on:
  push:
    branches:
      - 'repair/restore-actions-sha-pinning-2026-09-13'
    paths:
      - '.github/workflows/emergency-sha-pin-repair.yml'

permissions:
  contents: write

concurrency:
  group: emergency-sha-pin-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Resolve and pin every external GitHub Action
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve mutable action references, pin, verify, and self-remove
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess
          import urllib.parse
          from datetime import datetime, timezone

          repo = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          trigger_sha = os.environ['TRIGGER_SHA']
          self_path = '.github/workflows/emergency-sha-pin-repair.yml'
          workflow_dir = '.github/workflows'

          action_re = re.compile(
              r'(?P<prefix>\buses:\s*)'
              r'(?P<action>[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.\-/]+)?)'
              r'@(?P<ref>[^\s#]+)'
          )
          full_sha_re = re.compile(r'^[0-9a-fA-F]{40}$')

          def gh_json(endpoint, method='GET', payload=None):
              cmd = ['gh', 'api']
              if method != 'GET':
                  cmd += ['--method', method]
              cmd.append(endpoint)
              data = None
              if payload is not None:
                  cmd += ['--input', '-']
                  data = json.dumps(payload).encode('utf-8')
              proc = subprocess.run(cmd, input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if proc.returncode != 0:
                  raise RuntimeError(
                      f"gh api {method} {endpoint} failed: "
                      + proc.stderr.decode('utf-8', errors='replace').strip()
                  )
              raw = proc.stdout.decode('utf-8')
              return json.loads(raw) if raw.strip() else None

          def content_endpoint(path):
              return f"repos/{repo}/contents/{path}"

          encoded_branch = urllib.parse.quote(branch, safe='')
          listing = gh_json(f"{content_endpoint(workflow_dir)}?ref={encoded_branch}")
          workflow_paths = sorted(
              item['path'] for item in listing
              if item.get('type') == 'file'
              and item['path'].lower().endswith(('.yml', '.yaml'))
              and item['path'] != self_path
          )

          if not workflow_paths:
              raise RuntimeError('No active workflow YAML files found')

          files = {}
          refs = set()
          for path in workflow_paths:
              obj = gh_json(f"{content_endpoint(path)}?ref={encoded_branch}")
              text = base64.b64decode(obj['content']).decode('utf-8')
              files[path] = {'sha': obj['sha'], 'text': text}
              for match in action_re.finditer(text):
                  ref = match.group('ref')
                  if not full_sha_re.fullmatch(ref):
                      refs.add((match.group('action'), ref))

          resolutions = {}
          failures = []
          for action, ref in sorted(refs):
              parts = action.split('/')
              action_repo = '/'.join(parts[:2])
              encoded_ref = urllib.parse.quote(ref, safe='')
              try:
                  commit = gh_json(f"repos/{action_repo}/commits/{encoded_ref}")
                  sha = commit.get('sha', '') if isinstance(commit, dict) else ''
                  if not full_sha_re.fullmatch(sha):
                      raise RuntimeError(f'invalid resolved SHA: {sha!r}')
                  resolutions[(action, ref)] = sha.lower()
                  print(f"RESOLVED {action}@{ref} -> {sha.lower()}")
              except Exception as exc:
                  failures.append(f"{action}@{ref}: {exc}")

          if failures:
              raise RuntimeError('Refusing partial repair; unresolved action refs:\n' + '\n'.join(failures))

          changed = {}
          def replace_ref(match):
              action = match.group('action')
              ref = match.group('ref')
              if full_sha_re.fullmatch(ref):
                  return match.group(0)
              sha = resolutions[(action, ref)]
              return f"{match.group('prefix')}{action}@{sha} # {ref}"

          for path, info in files.items():
              new_text = action_re.sub(replace_ref, info['text'])
              if new_text != info['text']:
                  changed[path] = new_text

          if not changed:
              raise RuntimeError('No mutable external action references were found; repair would be a no-op')

          for path, new_text in changed.items():
              payload = {
                  'message': f'repair(ci): pin external actions in {os.path.basename(path)}',
                  'content': base64.b64encode(new_text.encode('utf-8')).decode('ascii'),
                  'sha': files[path]['sha'],
                  'branch': branch,
              }
              gh_json(content_endpoint(path), method='PUT', payload=payload)
              print(f"UPDATED {path}")

          # Re-fetch and fail closed if any mutable external action reference remains.
          remaining = []
          for path in workflow_paths:
              obj = gh_json(f"{content_endpoint(path)}?ref={encoded_branch}")
              text = base64.b64decode(obj['content']).decode('utf-8')
              for match in action_re.finditer(text):
                  ref = match.group('ref')
                  if not full_sha_re.fullmatch(ref):
                      remaining.append(f"{path}: {match.group('action')}@{ref}")

          if remaining:
              raise RuntimeError('Verification failed; mutable refs remain:\n' + '\n'.join(remaining))

          now = datetime.now(timezone.utc).isoformat()
          mapping_lines = [
              f"- `{action}@{ref}` -> `{sha}`"
              for (action, ref), sha in sorted(resolutions.items())
          ]
          changed_lines = [f"- `{path}`" for path in sorted(changed)]
          report = '\n'.join([
              '# GitHub Actions SHA Pinning Repair Evidence',
              '',
              f'- Generated: `{now}`',
              f'- Repository: `{repo}`',
              f'- Repair branch: `{branch}`',
              f'- Trigger commit: `{trigger_sha}`',
              f'- Active workflow files inspected: `{len(workflow_paths)}`',
              f'- Workflow files changed: `{len(changed)}`',
              f'- Mutable external references resolved: `{len(resolutions)}`',
              '- Post-repair mutable external references remaining: `0`',
              '',
              '## Changed workflow files',
              '',
              *changed_lines,
              '',
              '## Immutable resolution map',
              '',
              *mapping_lines,
              '',
              '## Verification rule',
              '',
              'Every external `uses:` reference in active `.github/workflows/*.yml` and `.yaml` files was re-read after mutation. Local `./` actions are not external supply-chain references. Any external reference not ending in a full 40-character commit SHA causes this repair to fail closed.',
              '',
          ])

          report_path = 'evidence/2026-09-13-actions-sha-repair/ACTION_PINNING_REPORT.md'
          report_payload = {
              'message': 'evidence(ci): record immutable action pinning repair',
              'content': base64.b64encode(report.encode('utf-8')).decode('ascii'),
              'branch': branch,
          }
          gh_json(content_endpoint(report_path), method='PUT', payload=report_payload)
          print(f"EVIDENCE {report_path}")

          # Remove the one-shot repair harness so it cannot become a persistent write-capable workflow.
          self_obj = gh_json(f"{content_endpoint(self_path)}?ref={encoded_branch}")
          delete_payload = {
              'message': 'cleanup(ci): remove one-shot SHA pin repair harness',
              'sha': self_obj['sha'],
              'branch': branch,
          }
          gh_json(content_endpoint(self_path), method='DELETE', payload=delete_payload)
          print('SELF-REMOVED emergency repair workflow')
          PY
